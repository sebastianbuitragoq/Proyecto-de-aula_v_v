sonar.projectKey=sebastianbuitragoq_Proyecto-de-aula_v_v
sonar.organization=sebastianbuitragoq
sonar.projectName=Proyecto-de-aula_v_v
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Solo se analiza el codigo fuente. Sin esto SonarQube recorre todo el
# proyecto, incluida dist/ (la salida compilada), y reporta como duplicacion
# el codigo generado: por ejemplo dist/infrastructure/database/seed.js, que
# es el mismo seed.ts pero transpilado.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

sonar.exclusions=dist/**,coverage/**,node_modules/**,prisma/migrations/**,**/*.json

# Cobertura generada con: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
